<title>FLC Connect</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: ivory page, floating pill nav, big rounded navy panels set inside the page, bento cards below. */
:root{
  --navy:#12305A; --royal:#002474; --gold:#C69E55; --bronze:#664E21;
  --grad:linear-gradient(135deg,#12305A 0%,#0B2463 55%,#002474 100%);
  --bg:#F6F3EC; --surface:#FFFFFF; --surface-2:#F0EBE0; --ink:#0F1F3A; --muted:#5E6677; --line:#E4DDCE;
  --gold-ink:#7E602A; --link:#002474; --focus:#C69E55; --btn:#0F1F3A; --btn-ink:#FFFFFF;
  --good:#23704A; --good-bg:#E2F1E8; --fair:#8D5F05; --fair-bg:#FAEFD6; --low:#A9342A; --low-bg:#FAE4E0;
  --shadow:0 10px 30px rgba(18,48,90,.08); --nav:rgba(255,255,255,.88);
  --f-slab:"Alfa Slab One","Rockwell","Roboto Slab",Georgia,serif;
  --f-body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --f-accent:"Times New Roman",Times,serif;
  --r-xl:32px; --r-lg:22px; --r-md:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111F; --surface:#101C31; --surface-2:#16253F; --ink:#ECEFF5; --muted:#9EA9BD; --line:#22324F;
  --gold-ink:#DDBC80; --link:#A9C0F5; --btn:#C69E55; --btn-ink:#16110A;
  --good:#6CCB98; --good-bg:#14322A; --fair:#E7B95A; --fair-bg:#382B12; --low:#F08A7E; --low-bg:#3B1B19;
  --shadow:0 10px 30px rgba(0,0,0,.35); --nav:rgba(16,28,49,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#101C31; --surface-2:#16253F; --ink:#ECEFF5; --muted:#9EA9BD; --line:#22324F;
  --gold-ink:#DDBC80; --link:#A9C0F5; --btn:#C69E55; --btn-ink:#16110A;
  --good:#6CCB98; --good-bg:#14322A; --fair:#E7B95A; --fair-bg:#382B12; --low:#F08A7E; --low-bg:#3B1B19;
  --shadow:0 10px 30px rgba(0,0,0,.35); --nav:rgba(16,28,49,.9); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-body);font-weight:800;letter-spacing:-.025em;line-height:1.08;text-wrap:balance;margin:0}
h2{font-size:clamp(1.7rem,3.6vw,2.6rem)} h3{font-size:1.12rem;letter-spacing:-.01em}
.slab{font-family:var(--f-slab);font-weight:400;letter-spacing:0}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.accent{font-family:var(--f-accent);font-style:italic}
.muted{color:var(--muted)} .small{font-size:.85rem}
.label{display:inline-block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold-ink);background:color-mix(in srgb,var(--gold) 16%,transparent);padding:4px 11px;border-radius:999px}

/* Floating pill nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.navshell{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;padding-top:12px}
.nav{display:flex;align-items:center;gap:10px;background:var(--nav);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 10px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0 4px 0 0;font:inherit}
.seal{width:40px;height:40px;flex:none;border-radius:50%;object-fit:contain}
.brand-name{font-family:var(--f-slab);font-size:1.15rem;line-height:1;white-space:nowrap}
.roles{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.roles button{background:none;border:0;color:var(--muted);font:600 .86rem var(--f-body);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:40px}
.roles button:hover{color:var(--ink)}
.roles button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.demo-foot{border-top:1px solid var(--line)}
.demo-foot .demo{width:100%;padding-block:12px}
.demo{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:.78rem;color:var(--muted);padding-block:8px 0}
.demo b{color:var(--gold-ink);letter-spacing:.1em;text-transform:uppercase;font-size:.68rem}
.linkbtn{background:none;border:0;color:var(--link);font:600 .8rem var(--f-body);cursor:pointer;text-decoration:underline;padding:4px}

/* Buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 .92rem var(--f-body);border-radius:999px;padding:12px 22px;min-height:48px;border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn-primary{background:var(--btn);color:var(--btn-ink)}
.btn-primary:hover{filter:brightness(1.15)}
.btn-gold{background:var(--gold);color:#1B1408}
.btn-gold:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold)}
.btn-outline-light{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.btn-outline-light:hover{border-color:var(--gold)}
.btn-danger{background:var(--surface);border-color:var(--low);color:var(--low)}
.btn-sm{min-height:38px;padding:7px 15px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.lbl{display:block;font-weight:700;font-size:.82rem;margin-bottom:5px}
input[type=text],input[type=email],input[type=url],input[type=tel],input[type=search],select,textarea{width:100%;font:500 1rem var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:48px}
textarea{min-height:90px;resize:vertical}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--surface);cursor:pointer;min-height:44px;font-weight:600;font-size:.88rem}
.check input{width:18px;height:18px;accent-color:var(--royal)}
.hint{font-size:.8rem;color:var(--muted)}
.err{color:var(--low);font-weight:600;font-size:.85rem}

/* Surfaces */
main{padding-block:22px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:thin}
.pills button{flex:none;background:var(--surface-2);border:0;color:var(--ink);font:600 .88rem var(--f-body);padding:10px 17px;border-radius:999px;cursor:pointer;min-height:42px}
.pills button[aria-selected="true"],.pills button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:7px;border-radius:999px;background:var(--gold);color:#1B1408;font-size:.7rem;line-height:20px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;border-radius:999px;padding:4px 11px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-good{color:var(--good);background:var(--good-bg)} .p-fair{color:var(--fair);background:var(--fair-bg)} .p-low{color:var(--low);background:var(--low-bg)} .p-mute{color:var(--muted);background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.76rem;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.chip.hit{background:color-mix(in srgb,var(--gold) 26%,var(--surface));color:var(--ink)}
.person{display:flex;gap:12px;align-items:center;min-width:0}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--grad);border:2px solid var(--gold);font-size:.9rem}
.person b{display:block;line-height:1.25}
.list{display:flex;flex-direction:column;gap:12px}
.item{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.item>.grow{flex:1 1 260px;min-width:0}

/* View header panel (brand band) */
.vhead{background:var(--grad);color:#fff;border-radius:var(--r-xl);padding:26px clamp(20px,4vw,34px);margin-bottom:20px;position:relative;overflow:hidden;display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.vhead::after{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;border:22px solid rgba(198,158,85,.16);pointer-events:none}
.vhead h2{font-size:clamp(1.6rem,3.4vw,2.3rem);color:#fff}
.vhead .accent{color:var(--gold);font-size:1.12rem}
.vhead .sub{color:#C9D4EA;font-size:.9rem;margin:6px 0 0}
.vhead .field{position:relative;z-index:1;min-width:230px}
.vhead label.lbl{color:#C9D4EA;font-weight:600}
.vhead select{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}
.vhead select option{color:#0F1F3A;background:#fff}

/* Match ring */
.ring{--p:0;width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--surface-2) 0)}
.ring>span{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;font-weight:800;font-size:.92rem;font-variant-numeric:tabular-nums;line-height:1}
.ring small{display:block;font-size:.52rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px}
.tile .n{font-size:2.2rem;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .l{font-size:.8rem;color:var(--muted);font-weight:600}

/* Tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:640px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td .row{flex-wrap:nowrap}

/* Landing hero */
.hero{background:var(--grad);color:#fff;border-radius:var(--r-xl);padding:clamp(26px,5vw,56px);position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:30px;align-items:center}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero::before{content:"";position:absolute;left:-120px;bottom:-200px;width:420px;height:420px;border-radius:50%;border:34px solid rgba(198,158,85,.1)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(198,158,85,.35),transparent 70%)}
.hero>*{position:relative;z-index:1}
.hero .eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.hero .eyebrow .seal{width:64px;height:64px;box-shadow:0 0 0 3px rgba(198,158,85,.35)}
.hero .eyebrow .accent{color:var(--gold);font-size:1.15rem;line-height:1.2}
.hero h1{font-family:var(--f-slab);font-weight:400;letter-spacing:0;font-size:clamp(2.2rem,5.6vw,4rem);line-height:1.02}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p.lead{font-size:1.06rem;color:#D3DCEE;max-width:46ch;margin:18px 0 24px}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.badge{display:flex;gap:9px;align-items:center;border:1px dashed rgba(198,158,85,.6);border-radius:14px;padding:10px 13px;font-size:.78rem;font-weight:600;color:#E6ECF7;max-width:220px}
.badge svg{flex:none;width:22px;height:22px;stroke:var(--gold)}

/* Hero preview panel */
.stage{position:relative;display:flex;justify-content:center;padding:30px 0 40px}
.phone{width:320px;max-width:100%;transform:rotate(-2deg)}
.screen{background:#F6F3EC;color:#0F1F3A;border-radius:24px;overflow:hidden;padding:18px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.screen .mini-h{font-weight:800;font-size:.95rem;letter-spacing:-.02em}
.mcard{background:#fff;border-radius:16px;padding:12px;margin-top:10px;box-shadow:0 4px 14px rgba(18,48,90,.08)}
.mcard .t{font-weight:800;font-size:.8rem;line-height:1.2}
.mcard .s{font-size:.66rem;color:#5E6677}
.mchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.mchips span{font-size:.6rem;font-weight:700;background:#F1E6D0;border-radius:999px;padding:2px 7px}
.mbar{height:6px;border-radius:3px;background:#ECE6DA;margin-top:6px;overflow:hidden}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#002474,#C69E55)}
.float{position:absolute;background:var(--surface);color:var(--ink);border-radius:18px;padding:12px 14px;box-shadow:0 18px 40px rgba(0,0,0,.28);font-size:.78rem;width:210px}
.float.f1{right:max(0px,calc(50% - 250px));bottom:6px;transform:rotate(2deg)}
.float.f2{left:max(0px,calc(50% - 290px));top:0;transform:rotate(-2deg);width:175px;z-index:2}
.float.f1{z-index:2}
@media (max-width:520px){.float.f1{right:0;bottom:0}.float.f2{left:0;top:0}.float{width:160px}}

/* Landing sections */
.section{margin-top:clamp(48px,8vw,90px)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.sec-head p{max-width:40ch;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);margin-top:44px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:22px 16px;text-align:center;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
@media (max-width:700px){.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}
.stat .n{font-size:clamp(2.2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.82rem;color:var(--muted);font-weight:600;margin-top:6px}
.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.bento{grid-template-columns:1fr}}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:10px}
.fcard .top{display:flex;align-items:center;gap:10px}
.icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.icon svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fcard p{margin:0;color:var(--muted);font-size:.9rem}
.flow{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(20px,4vw,50px);align-items:start}
@media (max-width:860px){.flow{grid-template-columns:1fr}}
.steps{display:flex;flex-direction:column}
.stepbtn{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 0;cursor:pointer;color:var(--muted);font:inherit;position:relative}
.stepbtn b{display:flex;align-items:center;gap:10px;font-size:1.05rem;color:inherit}
.stepbtn .num{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);font-size:.78rem;font-weight:800}
.stepbtn span.d{display:block;font-size:.88rem;margin:6px 0 0 38px}
.stepbtn[aria-selected="true"]{color:var(--ink)}
.stepbtn[aria-selected="true"] .num{background:var(--gold);color:#1B1408}
.stepbtn[aria-selected="true"]::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:40%;background:var(--gold)}
.preview{border-radius:var(--r-xl);padding:clamp(18px,4vw,36px);min-height:360px;display:flex;align-items:center;justify-content:center;
  background:repeating-radial-gradient(circle at 110% -10%,transparent 0 14px,color-mix(in srgb,var(--gold) 14%,transparent) 14px 15px),linear-gradient(140deg,color-mix(in srgb,var(--gold) 30%,var(--surface)),color-mix(in srgb,var(--royal) 14%,var(--surface)))}
.preview .card{width:100%;max-width:420px;box-shadow:var(--shadow)}
.dark-panel{background:#0B1628;color:#E8ECF4;border-radius:var(--r-xl);padding:clamp(24px,5vw,52px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px;align-items:center}
@media (max-width:860px){.dark-panel{grid-template-columns:1fr}}
.dark-panel h2{color:#fff}
.dark-panel p{color:#B4BFD3}
.dark-panel .label{background:rgba(198,158,85,.18);color:var(--gold)}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mosaic div{aspect-ratio:1;border-radius:18px;display:grid;place-items:center;font-weight:800;font-size:1.1rem;color:#fff;background:var(--grad);border:2px solid rgba(198,158,85,.5)}
.mosaic div.you{background:var(--gold);color:#1B1408;font-size:.8rem;letter-spacing:.12em}
.mosaic div.alt{background:#1A2B4A}
.cta{text-align:center;padding:clamp(30px,6vw,60px) 16px}
.cta h2{font-family:var(--f-slab);font-weight:400;letter-spacing:0}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(6,14,30,.55);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.overlay{align-items:center;padding-bottom:12px}}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{border-radius:26px}}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.x{background:var(--surface-2);border:0;border-radius:50%;width:40px;height:40px;font-size:1.2rem;cursor:pointer;color:var(--ink);flex:none}
.lockbox{border:1px dashed var(--gold);border-radius:16px;padding:13px 15px;background:color-mix(in srgb,var(--gold) 9%,var(--surface))}
.paper{background:#fff;color:#1d2433;border-radius:10px;padding:22px;border:1px solid var(--line);font-size:.85rem}
.paper h4{font-family:Georgia,serif;font-size:1.3rem;margin:0}
.paper hr{border:0;border-top:1px solid #ccd;margin:10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#0F1F3A;color:#fff;padding:12px 20px;border-radius:999px;z-index:30;font-weight:600;font-size:.88rem;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.bar{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--royal),var(--gold))}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .trk{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.switch input:checked+.trk{background:var(--good)}
.switch input:checked+.trk::after{left:25px}
.switch input:focus-visible+.trk{outline:3px solid var(--focus);outline-offset:2px}
.switch input:disabled+.trk{opacity:.45}
.prose{max-width:68ch} .prose h3{margin:24px 0 6px} .prose p,.prose li{margin:6px 0}
.helper-cta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--grad);color:#fff}
.helper-cta b{display:block}.helper-cta span{color:#C9D4EA;font-size:.84rem}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
@media (max-width:560px){.compare{grid-template-columns:1fr}}
.compare>div{border-radius:12px;padding:10px 12px;font-size:.88rem;min-width:0;overflow-wrap:anywhere}
.compare .was{background:var(--surface-2);color:var(--muted)}
.compare .now{background:color-mix(in srgb,var(--gold) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 50%,transparent)}
.compare small{display:block;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.sugg{border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.sugg.acc{border-color:var(--good);background:color-mix(in srgb,var(--good) 7%,var(--surface))}
.sugg.skip{opacity:.55}
.thinking{display:flex;gap:12px;align-items:center;padding:18px;border-radius:16px;background:var(--surface-2)}
.dots{display:flex;gap:5px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:bl 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.paper .li{padding-left:14px;position:relative}.paper .li::before{content:"•";position:absolute;left:2px}
.paper .hd{font-weight:800;letter-spacing:.06em;margin-top:12px;border-top:1px solid #ccd;padding-top:8px}
footer .wrap{padding-block:22px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line)}
@media (max-width:640px){.brand-name{display:none}.roles button{padding:9px 11px;font-size:.82rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function match(s,o){
  const ss=s.skills.map(x=>x.toLowerCase()),hits=o.skills.filter(k=>ss.includes(k.toLowerCase()));

  if(s.field===o.field){pts+=35;why.push("Same field")}
  pts+=Math.round(35*hits.length/Math.max(o.skills.length,1));
  if(hits.length)why.push(hits.length+" of "+o.skills.length+" skills");
  if(s.looking.includes(o.jobType)){pts+=15;why.push("Wants "+o.jobType.toLowerCase())}
  if(s.city===o.city){pts+=15;why.push("Lives in "+o.city)}else pts+=7;
  return{score:Math.min(100,pts),hits,why};
}

Rules:

Resume text:
"""
${text.slice(0,12000)}
"""

Reply with only JSON in exactly this shape:
{"summary":"one or two sentences on the biggest way to improve this resume","suggestions":[{"section":"Experience","original":"exact line from the resume","suggested":"the improved line","why":"short reason, under 15 words"}],"skillsToAdd":["skills from the profile list that are missing from the resume"]}`;

async function runHelper(){
  const h=ui.h,s=S(h.sid),t=$("#h-text");if(t)h.text=t.value;
  if(!h.text.trim()){h.err="Add your resume text first.";paintHelper();return}
  if(!sampleFn){h.err="The resume helper isn't available in this view. Open the demo from its link to try it.";paintHelper();return}
  h.status="loading";h.err="";h.data=null;h.dec={};h.skills=[];paintHelper();
  const ctl=new AbortController();h.ctl=ctl;const o=h.target?O(h.target):null;
  try{
    const d=await sampleFn.json(helperPrompt(s,h.text,o),{signal:ctl.signal,cache:false});
    if(ui.h!==h)return;
    const lines=h.text.split("\n").map(x=>x.trim());
    const sug=(Array.isArray(d?.suggestions)?d.suggestions:[]).filter(g=>g&&typeof g.original==="string"&&typeof g.suggested==="string"&&g.original.trim()&&h.text.includes(g.original.trim())&&g.original.trim()!==g.suggested.trim()).map(g=>({section:String(g.section||""),original:g.original.trim(),suggested:g.suggested.trim(),why:String(g.why||"")})).slice(0,6);
    const low=h.text.toLowerCase();
    const sk=(Array.isArray(d?.skillsToAdd)?d.skillsToAdd:[]).map(String).filter(k=>s.skills.some(x=>x.toLowerCase()===k.toLowerCase())&&!low.includes(k.toLowerCase()));
    if(!sug.length&&!sk.length){h.status="idle";h.err="No clear changes came back. Try again, or tailor it to an opening.";paintHelper();return}
    h.data={summary:String(d.summary||""),suggestions:sug,skillsToAdd:sk};h.status="done";paintHelper();
  }catch(e){
    if(ui.h!==h)return;h.status="idle";
    const c=e&&e.code;
    h.err=c==="cancelled"?"":c==="not_granted"||c==="sampling_disabled"?"The resume helper wasn't allowed in this view.":c==="rate_limited"?"Too many requests right now. Try again in a minute.":c==="invalid_json"?"The suggestions came back in a format we couldn't read. Try again.":"Something went wrong getting suggestions. Try again.";
    paintHelper();
  }
}
function buildFinal(){

}
let jspdfP=null;
let pdfjsP=null;
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
async function pdfText(file){
  if(!pdfjsP)pdfjsP=loadScript(PDFJS+"pdf.min.js").then(()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";return window.pdfjsLib});
  const work=(async()=>{const lib=await pdfjsP;const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const out=[];
    for(let p=1;p<=Math.min(pdf.numPages,4);p++){const pg=await pdf.getPage(p),c=await pg.getTextContent();let line="",lastY=null;
      for(const it of c.items){const y=it.transform[5];if(lastY!==null&&Math.abs(y-lastY)>3){if(line.trim())out.push(line.trim());line=""}line+=it.str;lastY=y}
      if(line.trim())out.push(line.trim());out.push("")}
    return out.join("\n").trim()})();
  return Promise.race([work,new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),20000))]);
}
function loadScript(src){return new Promise((res,rej)=>{const x=document.createElement("script");x.src=src;x.onload=res;x.onerror=rej;document.head.appendChild(x)})}
async function resumePdf(text){
  if(!jspdfP)jspdfP=loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  await jspdfP;const doc=new window.jspdf.jsPDF({unit:"pt",format:"letter"});
  const W=612-108;let y=64,first=true;
  const nl=h=>{if(y+h>740){doc.addPage();y=64}};
  text.split("\n").forEach(l=>{const t=l.trim();if(!t){y+=6;return}
    if(first){first=false;doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text(t,54,y);y+=20;doc.setFont("helvetica","normal");doc.setFontSize(10);return}
    if(/[A-Z]/.test(t)&&t===t.toUpperCase()&&t.length<40){nl(30);y+=8;doc.setDrawColor(198,158,85);doc.line(54,y-10,558,y-10);doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.text(t,54,y+2);y+=16;doc.setFont("helvetica","normal");doc.setFontSize(10);return}
    const bullet=/^[-•*]\s*/.test(t),body=bullet?t.replace(/^[-•*]\s*/,""):t;

function csvFor(set){
